name: Build my_keyboard

"on":
  workflow_dispatch:
  push:
    paths:
      - "keyboards/handwired/my_keyboard/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout keyboard repository
        uses: actions/checkout@v4

      - name: Checkout Vial QMK
        uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          ref: vial
          submodules: recursive
          path: vial-qmk

      - name: Install QMK CLI
        shell: bash
        run: |
          python3 -m pip install --user qmk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          qmk --version
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-pip \
            git \
            make \
            rsync \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi
      - name: Copy keyboard into Vial QMK
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Checking my_keyboard ==="
          test -d "my_keyboard"

          echo "=== Keyboard files in repository ==="
          find "my_keyboard" -type f -print

          echo "=== Creating Vial-QMK destination ==="
          mkdir -p "vial-qmk/keyboards/handwired/my_keyboard"

          echo "=== Copying keyboard ==="
          rsync -av --delete \
            "my_keyboard/" \
            "vial-qmk/keyboards/handwired/my_keyboard/"

          echo "=== Files copied into Vial-QMK ==="
          find "vial-qmk/keyboards/handwired/my_keyboard" -type f -print
      - name: Verify Vial config
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Vial config.h ==="
          cat "vial-qmk/keyboards/handwired/my_keyboard/keymaps/vial/config.h"

          echo "=== Checking Vial unlock definitions ==="
          grep -n "VIAL_UNLOCK_COMBO" \
            "vial-qmk/keyboards/handwired/my_keyboard/keymaps/vial/config.h"

          test -f \
            "vial-qmk/keyboards/handwired/my_keyboard/keymaps/vial/config.h"

          grep -q "VIAL_UNLOCK_COMBO_ROWS" \
            "vial-qmk/keyboards/handwired/my_keyboard/keymaps/vial/config.h"

          grep -q "VIAL_UNLOCK_COMBO_COLS" \
            "vial-qmk/keyboards/handwired/my_keyboard/keymaps/vial/config.h"

          echo "Vial unlock configuration found."
      - name: Verify keyboard files
        shell: bash
        run: |
          set -e
          test -f "vial-qmk/keyboards/handwired/my_keyboard/keyboard.json"
          test -f "vial-qmk/keyboards/handwired/my_keyboard/keymaps/vial/keymap.c"
          test -f "vial-qmk/keyboards/handwired/my_keyboard/keymaps/vial/rules.mk"
          test -f "vial-qmk/keyboards/handwired/my_keyboard/keymaps/vial/vial.json"
          python3 -m json.tool             "vial-qmk/keyboards/handwired/my_keyboard/keyboard.json"             >/dev/null
          python3 -m json.tool             "vial-qmk/keyboards/handwired/my_keyboard/keymaps/vial/vial.json"             >/dev/null
          echo "Keyboard files and JSON are valid."

      - name: Show installed keyboard definition
        shell: bash
        run: |
          find "vial-qmk/keyboards/handwired/my_keyboard" -type f -print

      - name: Check QMK CLI
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          command -v qmk
          qmk --version

      - name: Build Vial firmware
        working-directory: vial-qmk
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          qmk compile -kb handwired/my_keyboard -km vial

      - name: Collect firmware
        shell: bash
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find "$GITHUB_WORKSPACE/vial-qmk/.build" -type f             \( -name "*.uf2" -o -name "*.bin" -o -name "*.hex" \)             -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \;
          ls -lah "$GITHUB_WORKSPACE/artifacts"
          test -n "$(find "$GITHUB_WORKSPACE/artifacts" -maxdepth 1 -type f -print -quit)"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: my_keyboard_vial_firmware
          path: artifacts/
