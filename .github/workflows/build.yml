# ─────────────────────────────────────────────────────────────────
# .github/workflows/build.yml
# Generated by QMK/Vial Wizard v5.6 on 2026-08-29
# Fully patched for modern QMK data-driven compilation requirements
# ─────────────────────────────────────────────────────────────────

name: Build my_keyboard

on:
  push:
    paths:
      - "keyboards/handwired/my_keyboard/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: # allows manual trigger from GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get your keyboard definition files
      - uses: actions/checkout@v4

      # Step 2: Get the Vial-QMK firmware base
      - uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          ref: vial
          submodules: recursive
          path: vial-qmk

      # Step 3: Install build dependencies
      - run: sudo apt-get update && sudo apt-get install -y python3 python3-pip git make rsync jq

      # Step 4: Install the QMK CLI tool
      - run: python3 -m pip install qmk && echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Step 5: Copy and patch keyboard definition into the vial-qmk tree
      - run: |
          # Sanity check: keyboards/ folder must exist.
          test -d keyboards/handwired/my_keyboard || (echo "ERROR: keyboards/handwired/my_keyboard/ not found. Push the extracted zip contents, not the zip file itself." && exit 1)
          
          mkdir -p vial-qmk/keyboards/handwired/my_keyboard
          rsync -av --delete keyboards/handwired/my_keyboard/ vial-qmk/keyboards/handwired/my_keyboard/
          
          # FIX 1: Rename legacy keyboard.json to info.json so QMK parses layouts
          if [ -f vial-qmk/keyboards/handwired/my_keyboard/keyboard.json ]; then
            mv vial-qmk/keyboards/handwired/my_keyboard/keyboard.json vial-qmk/keyboards/handwired/my_keyboard/info.json
          fi

          # FIX 2 & 3: Inject valid bootloader and patch USB device version schema via jq
          jq '. + {"bootloader": "caterina", "usb": (.usb + {"device_version": "1.0.0"})}' \
            vial-qmk/keyboards/handwired/my_keyboard/info.json > temp.json && mv temp.json vial-qmk/keyboards/handwired/my_keyboard/info.json

      # Step 6: Verify required files are present before building
      - run: |
          test -f vial-qmk/keyboards/handwired/my_keyboard/info.json || (echo "ERROR: info.json missing" && exit 1)
          test -f vial-qmk/keyboards/handwired/my_keyboard/keymaps/vial/vial.json || (echo "ERROR: vial.json missing" && exit 1)
          find vial-qmk/keyboards/handwired/my_keyboard -type f -print

      # Step 7: Compile the firmware (V=1 = verbose output for debugging)
      - run: cd vial-qmk && make handwired/my_keyboard:vial V=1

      # Step 8: Collect the compiled firmware file(s)
      - run: |
          mkdir -p artifacts
          find vial-qmk/.build -type f \( -name "*.uf2" -o -name "*.bin" -o -name "*.hex" \) -exec cp {} artifacts/ \;
          echo "Firmware files:"; ls -lah artifacts
          test -n "$(ls -A artifacts)" || (echo "ERROR: No firmware found — check build log above" && exit 1)

      # Step 9: Upload so you can download from the Actions UI
      - uses: actions/upload-artifact@v4
        with:
          name: my_keyboard_vial_firmware
          path: artifacts
