steps:
  - name: Checkout keyboard repository
    uses: actions/checkout@v4

  - name: Checkout Vial QMK
    uses: actions/checkout@v4
    with:
      repository: vial-kb/vial-qmk
      ref: vial
      submodules: recursive
      path: vial-qmk

  - name: Install dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y python3 python3-pip git make rsync

  - name: Install QMK CLI
    run: |
      python3 -m pip install --user qmk
      echo "$HOME/.local/bin" >> "$GITHUB_PATH"

  - name: Copy keyboard definition
    run: |
      test -d keyboards/handwired/my_keyboard || (
        echo "ERROR: keyboards/handwired/my_keyboard/ not found."
        exit 1
      )

      mkdir -p vial-qmk/keyboards/handwired/my_keyboard

      rsync -av --delete \
        keyboards/handwired/my_keyboard/ \
        vial-qmk/keyboards/handwired/my_keyboard/

  - name: Verify keyboard files
    run: |
      echo "Keyboard files:"
      find vial-qmk/keyboards/handwired/my_keyboard -type f -print

      echo
      echo "Checking keyboard.json:"
      test -f vial-qmk/keyboards/handwired/my_keyboard/keyboard.json

      python3 -m json.tool \
        vial-qmk/keyboards/handwired/my_keyboard/keyboard.json \
        > /dev/null

      echo "keyboard.json is valid JSON."

  - name: Compile firmware
    run: |
      cd vial-qmk
      make handwired/my_keyboard:vial V=1

  - name: Collect firmware
    run: |
      mkdir -p artifacts

      find vial-qmk/.build -type f \
        \( -name "*.uf2" -o -name "*.bin" -o -name "*.hex" \) \
        -exec cp {} artifacts/ \;

      echo "Firmware files:"
      ls -lah artifacts

      test -n "$(ls -A artifacts)" || (
        echo "ERROR: No firmware found."
        exit 1
      )

  - name: Upload firmware
    uses: actions/upload-artifact@v4
    with:
      name: my_keyboard_vial_firmware
      path: artifacts
